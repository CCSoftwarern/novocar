<header>
  <nav
    class="navbar navbar-expand-lg navbar-dark fixed-top shadow LarguraNav"
    data-bs-theme="dark"
    aria-label="Navegação principal"
  >
    <div class="container-fluid">

      <!-- Marca -->
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <i class="bi bi-car-front brand-icon" aria-hidden="true"></i>
        <span>FlexCar</span>
      </a>

      <!-- Botão hamburguer (mobile) -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown"
        aria-expanded="false"
        aria-label="Abrir menu de navegação"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Conteúdo colapsável -->
      <div class="collapse navbar-collapse" id="navbarNavDropdown">

        <!-- Itens de seção -->
        <ul class="navbar-nav mx-auto">
          @for (item of itemsMenu; track $index) {
            <li class="nav-item">
              <a
                class="nav-link iconeLogin cursor"
                role="button"
                tabindex="0"
                  (click)="rolarPara(item.secao)"
                (keydown.enter)="rolarPara(item.secao)"
              >{{ item.rotulo }}</a>
            </li>
          }
        </ul>

        <!-- Login -->
        <a
          class="iconeLogin d-flex align-items-center gap-2"
          routerLink="/login"
          routerLinkActive="active"
        >
          <i class="bi bi-person-circle" aria-hidden="true"></i>
          <span>Login</span>
        </a>

      </div>
    </div>
  </nav>
</header>
