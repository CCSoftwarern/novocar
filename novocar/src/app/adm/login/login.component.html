<div class="card login-card shadow-lg">
  <div class="card-body p-4 p-md-5">

    <!-- Marca -->
    <div class="text-center mb-4">
      <i class="bi bi-car-front-fill brand-icon" aria-hidden="true"></i>
      <h1 class="h3 fw-bold mt-2 mb-1">Bem-vindo!</h1>
      <p class="text-muted mb-0">Entre com suas credenciais</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="entrar()" novalidate>

      <div class="mb-3">
        <label for="usuario" class="form-label fw-semibold">Usuário</label>
        <input
          id="usuario"
          type="text"
          class="form-control"
          formControlName="usuario"
          placeholder="Digite seu usuário"
          autocomplete="username"
        />
        @if (loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched) {
          <div class="text-danger small mt-1">Informe o usuário.</div>
        }
      </div>

      <div class="mb-4">
        <label for="senha" class="form-label fw-semibold">Senha</label>
        <input
          id="senha"
          type="password"
          class="form-control"
          formControlName="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        />
        @if (loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched) {
          <div class="text-danger small mt-1">Informe a senha.</div>
        }
      </div>

      <button type="submit" class="btn btn-login w-100 fw-semibold" [disabled]="loginForm.invalid">
        Entrar
      </button>

    </form>

    <div class="text-center mt-4">
      <a href="#" class="link-secondary small">Esqueceu sua senha?</a>
    </div>

    <div class="text-center mt-2">
      <a routerLink="/" class="link-secondary small">Voltar para a página inicial</a>
    </div>

  </div>
</div>
